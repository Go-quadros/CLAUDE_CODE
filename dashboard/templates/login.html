<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Quadros — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F5F3EE; --surface: #FFFFFF; --surface2: #EFEDE7;
      --border: #D8D4CA; --text: #1A1916; --muted: #7A7770;
      --accent: #2C6B4F; --accent-light: #E3EFE9; --danger: #9B2C2C;
      --font-display: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace;
    }
    body {
      font-family: var(--font-display);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .wrap { width: 100%; max-width: 380px; }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-light);
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .brand-badge::before { content: ''; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; }
    .brand h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .brand p { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 300; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 28px;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--text);
      padding: 0 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(44,107,79,0.1);
    }
    .btn {
      width: 100%;
      height: 46px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: var(--danger);
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-badge">Go Quadros</div>
    <h1>Marketing</h1>
    <p>Entre com sua conta para continuar</p>
  </div>
  <div class="card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="field">
        <label>Usuario</label>
        <input type="text" name="username" placeholder="seu usuario" autofocus autocomplete="username" />
      </div>
      <div class="field">
        <label>Senha</label>
        <div style="position:relative">
          <input type="password" name="password" id="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px" />
          <button type="button" onclick="togglePw()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;color:var(--muted);display:flex;align-items:center">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </div>
</div>
<script>
function togglePw() {
  const input = document.getElementById('password');
  const icon = document.getElementById('eye-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19M1 1l22 22"/><circle cx="12" cy="12" r="3" style="opacity:0"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}
</script>
</body>
</html>
